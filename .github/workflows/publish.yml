name: Publish Releases

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    name: Publish to PyPi
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for version detection with setuptools_scm

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build twine

    - name: Build distribution packages
      run: |
        python -m build

    # - name: Publish to PyPI
    #   uses: pypa/gh-action-pypi-publish@release/v1
    #   with:
    #     password: ${{ secrets.PYPI_API_TOKEN }}

  publish-conda:
    runs-on: ubuntu-latest
    name: Publish to Anaconda Cloud
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup conda with python ${{ matrix.python-version }}
      uses: s-weigand/setup-conda@v1
      with:
        update-conda: false
        python-version: ${{ matrix.python-version }}

    - name: Add conda defaults channel
      run: conda config --add channels defaults

    - name: Install conda-build
      run: |
        conda install conda-build anaconda-client

    - name: Build & upload with conda
      run: |
        # Login to anaconda (answer the resulting prompt with yes)
        echo y | anaconda --token ${{ secrets.ANACONDA_TOKEN }} login --username ${{ secrets.ANACONDA_USERNAME }} --password ${{ secrets.ANACONDA_PASSWORD }} --hostname "annuity_GitHub_${{ matrix.python-version }}"
        # Enable automatic upload to anaconda.org
        conda config --set anaconda_upload yes
        # Run build process
        conda build conda.recipe -c defaults -c conda-forge
