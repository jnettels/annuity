name: Python Jobs

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false  # complete remaining jobs
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for version detection with setuptools_scm

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tox and dependencies
      run: |
        python -m pip install --upgrade pip tox tox-gh-actions

    - name: Run tests with tox
      run: |
        tox -e py$(echo ${{ matrix.python-version }} | tr -d '.')

    - name: Lint with flake8
      if: runner.os == 'Linux' && matrix.python-version == '3.13'
      run: |
        pip install flake8 flake8-docstrings
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/annuity/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src/annuity/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
